name: Criar APK para Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build a compilar'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: apk-build-dispatch
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout do repositório via checkout@v5
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      # 2. Diagnóstico inicial do ambiente runner
      - name: Diagnostico do ambiente
        run: |
          echo "=== DIAGNOSTICO DO RUNNER (Ubuntu 24.04) ==="
          uname -a
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Disparado por: ${{ github.actor }}"
          echo "Build Type solicitado: ${{ github.event.inputs.build_type || 'release' }}"
          echo "--- Conteudo raiz ---"
          ls -la
          echo "--- Conteudo android-overlay/ ---"
          if [ -d "android-overlay" ]; then
            find android-overlay -maxdepth 4 -ls
          else
            echo "::error::Diretorio android-overlay ausente no checkout!"
            exit 1
          fi
          echo "=== FIM DO DIAGNOSTICO INICIAL ==="

      # 3. Configurar Node.js oficial (compatível com Node 24 runtime do GitHub Actions)
      # Nota: não ativamos cache no setup-node pois o repositório não commita package-lock.json;
      # o passo de instalação abaixo gerencia lockfile e instalação de forma tolerante e robusta.
      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 4. Instalar dependências Web do projeto React/Vite com tolerância total a lockfile ausente
      - name: Instalar dependencias Web
        run: |
          echo "=== CONFIGURANDO DEPENDENCIAS WEB ==="
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json encontrado no repositorio. Tentando npm ci..."
            npm ci || npm install --legacy-peer-deps
          else
            echo "package-lock.json ausente no repositorio. Executando npm install com --legacy-peer-deps..."
            npm install --legacy-peer-deps
          fi
          echo "Dependencias Web instaladas com sucesso."

      # 5. Compilar o frontend Web Vite (gera dist/)
      - name: Compilar frontend Web (Vite)
        run: |
          echo "Compilando versao web para pasta dist/..."
          npm run build
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::Pasta dist ausente ou vazia apos o build do Vite!"
            exit 1
          fi
          echo "Build Vite concluido com sucesso."

      # 6. ESTRATÉGIA AUTORREGENERATIVA: Regenerar esqueleto Android canônico do zero
      # Remove qualquer pasta android/ pré-existente (eliminando inconsistências/reversões de commit)
      # e recria via Capacitor CLI canônico, aplicando em seguida o overlay versionado
      - name: Regenerar esqueleto Android canônico com overlay
        run: |
          echo "=== REGENERANDO ESQUELETO ANDROID DO ZERO ==="
          rm -rf android

          echo "Executando: npx cap add android..."
          npx cap add android

          echo "Executando: npx cap sync android..."
          npx cap sync android

          echo "Aplicando android-overlay/ sobre o android/ canônico..."
          if [ -d "android-overlay" ]; then
            cp -r android-overlay/* android/
            echo "Overlay nativo copiado com sucesso sobre android/."
          else
            echo "::error::Diretorio android-overlay nao encontrado!"
            exit 1
          fi

          # Garantir sincronização do capacitor.config.json no assets
          echo "Garantindo capacitor.config.json em assets..."
          mkdir -p android/app/src/main/assets
          cat << 'EOF' > android/app/src/main/assets/capacitor.config.json
          {
            "appId": "br.com.rotaly.app",
            "appName": "Rotaly",
            "webDir": "public",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://www.rotaly.com.br",
              "androidScheme": "https",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false,
              "backgroundColor": "#0E1738"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF

          # Garantir que public/ dentro de assets contenha a compilação web recente
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

          echo "Conferindo estrutura resultante em android/app/src/main/java/br/com/rotaly/app/:"
          ls -la android/app/src/main/java/br/com/rotaly/app/
          ls -la android/app/src/main/java/br/com/rotaly/app/services/ || true
          echo "=== REGENERACAO CONCLUIDA COM SUCESSO ==="

      # 7. Configurar Java 17 (JDK Temurin) com setup-java@v5
      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Aceitar licenças do Android SDK e instalar platforms;android-34 + build-tools;34.0.0
      - name: Aceitar licencas e instalar Android SDK Platform 34 e Build-Tools
        run: |
          echo "=== CONFIGURANDO ANDROID SDK MANAGER E LICENCAS ==="
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
          fi
          echo "Usando Android SDK em: $SDK_DIR"

          SDKMANAGER_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          elif [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER_BIN="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi

          if [ -n "$SDKMANAGER_BIN" ] && [ -x "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager localizado em: $SDKMANAGER_BIN"
            echo "Aceitando todas as licencas do Android SDK..."
            yes | "$SDKMANAGER_BIN" --licenses || true
            echo "Instalando components necessarios: platform-tools, platforms;android-34, build-tools;34.0.0..."
            "$SDKMANAGER_BIN" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "::warning::sdkmanager binario nao encontrado em $SDK_DIR. Criando licencas manualmente..."
          fi

          # Garantir diretorio de licencas e hashes oficiais aceitos preventivamente
          mkdir -p "$SDK_DIR/licenses"
          echo -e "\n24333f8a63b1d7f2e51fa81f12b0452f0537b8a6\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b1d7f2e51fa81f12b0452f0537b8a6" > "$SDK_DIR/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$SDK_DIR/licenses/android-sdk-preview-license" || true
          echo "Licencas configuradas com sucesso."

      # 9. Configurar Gradle oficial com setup-gradle@v4
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      # 10. Decodificar Keystore de produção dos secrets do repositório
      # Suporta tanto KEYSTORE_FILE (base64) quanto KEYSTORE_BASE64 com fallback debug tolerante
      - name: Configurar Assinatura do Keystore
        id: setup_keystore
        env:
          KEYSTORE_FILE_SECRET: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f android/release.keystore
          B64_DATA="${KEYSTORE_FILE_SECRET:-$KEYSTORE_BASE64_SECRET}"

          if [ -n "$B64_DATA" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$B64_DATA" | tr -d '\r\n ' | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
            if [ -s "$GITHUB_WORKSPACE/android/release.keystore" ]; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "keystore_path=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_OUTPUT"
              echo "Keystore de release decodificado com sucesso ($(wc -c < "$GITHUB_WORKSPACE/android/release.keystore") bytes)."
            else
              echo "::warning::Falha na decodificacao do Keystore Base64 (arquivo vazio). Release usara fallback de debug."
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
              echo "keystore_path=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::Secrets de assinatura ausentes ou incompletos. Release usara fallback de debug."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      # 11. Preparar Gradle Wrapper oficial (8.2.1)
      - name: Preparar Gradle Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          if command -v gradle >/dev/null 2>&1; then
            echo "Gerando gradle-wrapper via Gradle oficial instalado..."
            gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          fi
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Baixando gradle-wrapper.jar oficial de services.gradle.org..."
            curl -fSL --retry 3 --connect-timeout 15 -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.2.1-wrapper.jar || true
          fi
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar nao pode ser gerado nem baixado!"
            exit 1
          fi
          chmod +x gradlew
          echo "Testando gradlew --version:"
          ./gradlew --version

      # =========================================================================
      # ETAPA 1: COMPILAÇÃO DO APK DEBUG (GARANTIA TOTAL DE ENTREGÁVEL NATIVO)
      # =========================================================================
      - name: Etapa 1 - Compilar APK Debug (assembleDebug)
        id: build_debug
        run: |
          cd android
          chmod +x gradlew
          echo "=== [ETAPA 1/2] COMPILANDO APK DEBUG ==="
          GRADLE_LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"
          echo "=== LOG ETAPA 1: assembleDebug ===" >> "$GRADLE_LOG_FILE"

          if ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee -a "$GRADLE_LOG_FILE"; then
            echo "assembleDebug concluido com sucesso."
          else
            echo "::error::FALHA CRITICA no assembleDebug!"
            if grep -n -E "FAILURE: Build failed|What went wrong:|Caused by:" "$GRADLE_LOG_FILE" >/dev/null 2>&1; then
              ROOT_CAUSE=$(grep -A 10 "What went wrong:" "$GRADLE_LOG_FILE" | head -n 10 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$ROOT_CAUSE" ] && echo "::error title=Gradle Root Cause (Debug)::$ROOT_CAUSE"
              CAUSED_BY=$(grep -A 5 "Caused by:" "$GRADLE_LOG_FILE" | head -n 5 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$CAUSED_BY" ] && echo "::error title=Gradle Caused By (Debug)::$CAUSED_BY"
            fi
            exit 1
          fi

          echo "=== CONFERINDO APK DEBUG GERADO ==="
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Nenhum APK debug encontrado apos assembleDebug!"
            exit 1
          fi
          echo "APK Debug gerado com sucesso: $DEBUG_APK ($(ls -lh "$DEBUG_APK" | awk '{print $5}'))"

      # 13. Publicar imediatamente o APK Debug como artifact rotaly-apk-debug
      - name: Publicar artifact rotaly-apk-debug
        uses: actions/upload-artifact@v6
        with:
          name: rotaly-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # =========================================================================
      # ETAPA 2: COMPILAÇÃO DO APK RELEASE (ASSINADO)
      # =========================================================================
      - name: Etapa 2 - Compilar APK Release (assembleRelease)
        id: build_release
        continue-on-error: true
        env:
          KEYSTORE_FILE: ${{ steps.setup_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          echo "=== [ETAPA 2/2] COMPILANDO APK RELEASE ==="
          GRADLE_LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"
          echo -e "\n\n=== LOG ETAPA 2: assembleRelease ===" >> "$GRADLE_LOG_FILE"

          if [ "${{ steps.setup_keystore.outputs.has_keystore }}" != "true" ]; then
            echo "::warning::Keystore nao configurado via secrets; build release caira no fallback de debug configurado no build.gradle."
          fi

          if ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee -a "$GRADLE_LOG_FILE"; then
            RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
            if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
              echo "assembleRelease concluido com sucesso: $RELEASE_APK ($(ls -lh "$RELEASE_APK" | awk '{print $5}'))"
              echo "release_success=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Release Sem APK::assembleRelease terminou sem gerar arquivo APK em app/build/outputs/apk/release."
              echo "release_success=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "::warning title=Falha no Release::RELEASE falhou, APK debug disponivel no artifact rotaly-apk-debug."
            if grep -n -E "FAILURE: Build failed|What went wrong:|Caused by:" "$GRADLE_LOG_FILE" >/dev/null 2>&1; then
              ROOT_CAUSE=$(grep -A 10 "What went wrong:" "$GRADLE_LOG_FILE" | head -n 10 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$ROOT_CAUSE" ] && echo "::warning title=Gradle Root Cause (Release)::$ROOT_CAUSE"
              CAUSED_BY=$(grep -A 5 "Caused by:" "$GRADLE_LOG_FILE" | head -n 5 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$CAUSED_BY" ] && echo "::warning title=Gradle Caused By (Release)::$CAUSED_BY"
            fi
            echo "release_success=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # 15. Publicar o APK Release assinado como artifact (quando concluído com sucesso)
      - name: Publicar artifact rotaly-apk-release
        if: steps.build_release.outcome == 'success' && steps.build_release.outputs.release_success == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: rotaly-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      # =========================================================================
      # LOG COMPLETO DO GRADLE (PUBLICADO SEMPRE, INDEPENDENTE DO RESULTADO)
      # =========================================================================
      - name: Salvar log completo do Gradle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 14
          if-no-files-found: ignore

      # =========================================================================
      # VERIFICAÇÃO FINAL: FALHAR CASO NENHUM APK TENHA SIDO PRODUZIDO
      # =========================================================================
      - name: Resumo e Verificacao Final do Build
        if: always()
        run: |
          echo "=== RESUMO DO BUILD DO ROTALY APK ==="
          DEBUG_EXISTS=false
          RELEASE_EXISTS=false

          if [ -d "android/app/build/outputs/apk/debug" ] && [ -n "$(find android/app/build/outputs/apk/debug -type f -name '*.apk')" ]; then
            DEBUG_EXISTS=true
            echo "STATUS DEBUG: SUCESSO (Artifact rotaly-apk-debug disponivel)"
            find android/app/build/outputs/apk/debug -type f -name "*.apk" -ls
          else
            echo "STATUS DEBUG: FALHOU OU AUSENTE"
          fi

          if [ -d "android/app/build/outputs/apk/release" ] && [ -n "$(find android/app/build/outputs/apk/release -type f -name '*.apk')" ]; then
            RELEASE_EXISTS=true
            echo "STATUS RELEASE: SUCESSO (Artifact rotaly-apk-release disponivel)"
            find android/app/build/outputs/apk/release -type f -name "*.apk" -ls
          else
            echo "STATUS RELEASE: NAO GERADO OU FALHOU (Usar APK debug como plano B)"
          fi

          if [ "$DEBUG_EXISTS" = "false" ] && [ "$RELEASE_EXISTS" = "false" ]; then
            echo "::error::Nenhum APK (debug ou release) foi gerado nesta execucao! Build finalizado com erro."
            exit 1
          fi
          echo "Build finalizado com sucesso — pelo menos um APK valido foi gerado e empacotado."
