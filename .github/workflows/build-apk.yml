name: Build Rotaly Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build (release ou debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      # a. Checkout do repositório
      - name: Checkout repositório
        uses: actions/checkout@v4

      # b. Diagnóstico do ambiente (primeiro passo após checkout para inspecionar runner real)
      - name: Diagnóstico do ambiente
        run: |
          echo "=== DIAGNÓSTICO DO RUNNER GITHUB ACTIONS ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "SDK não pré-instalado em ANDROID_HOME"
          echo "--- Android Platforms instaladas ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "Nenhuma plataforma encontrada"
          echo "--- Android Build-Tools instaladas ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "Nenhum build-tools encontrado"
          echo "--- Versão do Java pré-instalado ---"
          java -version 2>&1 || echo "Java não encontrado"
          echo "--- Versão do Node.js ---"
          node -v 2>&1 || echo "Node não encontrado"
          echo "=== FIM DO DIAGNÓSTICO ==="

      # c. Dependências web e build do frontend Vite
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências Web
        run: |
          bun install --frozen-lockfile || bun install

      - name: Build do frontend Web (Vite)
        run: |
          bun run build

      # d. Copiar dist/* para os assets públicos do Android
      - name: Copiar assets Web para o Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copiados para android/app/src/main/assets/public:"
          ls -lh android/app/src/main/assets/public/

      # e. Configurar Java 17 (Temurin com cache Gradle)
      # runners ubuntu-latest já possuem Android SDK pré-instalado (confirmado no diagnóstico)
      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # f. Decodificação e assinatura fixa (Secrets cadastrados pelo usuário no GitHub)
      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Configurar Assinatura do Keystore
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "keystore_pass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_pass=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "Keystore de release restaurado com sucesso a partir dos GitHub Secrets!"
          else
            echo "::warning::Secrets de assinatura não encontrados ou incompletos no repositório."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      # g. Compilação do APK via gradlew
      - name: Compilar APK Android
        env:
          KEYSTORE_FILE: ${{ steps.setup_keystore.outputs.has_keystore == 'true' && '../release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ steps.setup_keystore.outputs.keystore_pass }}
          KEY_ALIAS: ${{ steps.setup_keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.setup_keystore.outputs.key_pass }}
        run: |
          cd android
          # Garante gradle-wrapper.jar se não estiver no git
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            echo "Baixando gradle-wrapper.jar v8.2.1..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Iniciando compilação Gradle (modo: $BUILD_TYPE)..."

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # h. Upload do artifact do APK
      - name: Publicar APK no GitHub Actions (rotaly-apk)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotaly-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
