name: Criar APK para Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build (release ou debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Criar APK para Android
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout do repositório
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 2. Diagnóstico inicial do ambiente e arquivos Android
      - name: Diagnostico do ambiente e arquivos
        run: |
          echo "=== DIAGNOSTICO DO RUNNER (Ubuntu 24.04) ==="
          uname -a
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "--- Conteudo da raiz ---"
          ls -la
          echo "--- Estrutura do diretorio android/ ---"
          ls -la android/
          echo "--- Wrapper do Gradle ---"
          ls -la android/gradle/wrapper/ || echo "Diretorio wrapper nao encontrado"
          if [ -x "android/gradlew" ]; then
            echo "GRADLEW_STATUS: Executavel encontrado"
          else
            echo "GRADLEW_STATUS: gradlew AUSENTE ou sem permissao de execucao"
          fi
          echo "--- Android SDK Platforms ---"
          ls -la "$ANDROID_HOME/platforms" 2>/dev/null || echo "Nenhuma plataforma encontrada"
          echo "--- Android SDK Build-Tools ---"
          ls -la "$ANDROID_HOME/build-tools" 2>/dev/null || echo "Nenhum build-tools encontrado"
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "--- sdkmanager pacotes instalados (amostra) ---"
            sdkmanager --list_installed 2>/dev/null | head -20 || true
          fi
          echo "=== FIM DO DIAGNOSTICO INICIAL ==="

      # 3. Configurar ambiente Bun para o frontend
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Instalar dependências Web do projeto React/Vite
      - name: Instalar dependencias Web
        run: |
          echo "Instalando dependencias com Bun..."
          bun install --frozen-lockfile || bun install

      # 5. Compilar o frontend Web Vite (gera dist/)
      - name: Compilar frontend Web (Vite)
        run: |
          echo "Compilando versao web para pasta dist/..."
          bun run build
          test -d dist && ls -la dist/ || (echo "ERRO: Pasta dist nao foi gerada" && exit 1)

      # 6. Sincronizar assets do frontend no projeto Android
      - name: Sincronizar assets Web no Android
        run: |
          echo "Copiando bundle web para android/app/src/main/assets/public/..."
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          echo "Total de arquivos copiados:"
          ls -lh android/app/src/main/assets/public/ | head -15

      # 7. Configurar Java 17 JDK usando setup-java@v5
      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Decodificar Keystore de produção caso secrets estejam presentes
      - name: Configurar Assinatura do Keystore
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f android/release.keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/release.keystore
            if [ -s "android/release.keystore" ]; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "keystore_pass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
              echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
              echo "key_pass=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
              echo "Keystore de release decodificado com sucesso ($(stat -c%s android/release.keystore 2>/dev/null || wc -c < android/release.keystore) bytes)."
            else
              echo "::warning::Falha na decodificacao do KEYSTORE_BASE64 (arquivo vazio). Fallback ativado."
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::Secrets de assinatura ausentes ou parciais. O build utilizara fallback assinado com debug.keystore automaticamente."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      # 9. Garantir integridade do Gradle Wrapper antes da execução
      - name: Preparar Gradle Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar ausente ou vazio. Baixando wrapper oficial Gradle 8.2.1..."
            curl -fSL --retry 3 --connect-timeout 10 -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar || \
            curl -fSL --retry 3 --connect-timeout 10 -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.1/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/
          chmod +x gradlew
          ./gradlew --version || echo "Aviso: gradlew --version teve retorno nao-zero, prosseguindo com build..."

      # 10. Compilação Gradle com fallback debug garantido e captura de log detalhado
      - name: Compilar APK Android com Gradle
        env:
          KEYSTORE_FILE: ${{ steps.setup_keystore.outputs.has_keystore == 'true' && '../release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ steps.setup_keystore.outputs.keystore_pass }}
          KEY_ALIAS: ${{ steps.setup_keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.setup_keystore.outputs.key_pass }}
        run: |
          cd android
          chmod +x gradlew
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "=== INICIANDO COMPILACAO GRADLE (MODO SOLICITADO: $BUILD_TYPE) ==="

          BUILD_FAILED=0
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Tentando compilar assembleRelease..."
            ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log || BUILD_FAILED=1
          else
            echo "Compilando assembleDebug diretamente..."
            ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log || BUILD_FAILED=1
          fi

          if [ $BUILD_FAILED -ne 0 ]; then
            echo "::warning::Falha na compilacao principal ($BUILD_TYPE). Exibindo ultimas 200 linhas do log:"
            tail -n 200 gradle-build.log || true

            if [ "$BUILD_TYPE" = "release" ]; then
              echo "=== ATIVANDO FALLBACK AUTOMATICO PARA assembleDebug ==="
              ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-debug-fallback.log || {
                echo "::error::Fallback assembleDebug tambem falhou. Ultimas 200 linhas:"
                tail -n 200 gradle-debug-fallback.log || true
                exit 1
              }
            else
              exit 1
            fi
          fi

          echo "=== CONTEUDO DO DIRETORIO DE SAIDA DE APKS ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Sem pasta release"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Sem pasta debug"

      # 11. Publicar o APK gerado como artefato do GitHub Actions
      - name: Publicar APK no GitHub Actions (rotaly-apk)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotaly-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
