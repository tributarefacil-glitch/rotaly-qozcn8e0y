name: Criar APK para Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build (release ou debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - principal
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Criar APK para Android
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout do repositório
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 2. Diagnóstico inicial do ambiente
      - name: Diagnostico do ambiente
        run: |
          echo "=== DIAGNOSTICO DO RUNNER (Ubuntu 24.04) ==="
          uname -a
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "--- Estrutura raiz ---"
          ls -la
          echo "--- Estrutura android/ ---"
          ls -la android/
          echo "=== FIM DO DIAGNOSTICO ==="

      # 3. Configurar ambiente Bun para o frontend
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Instalar dependências Web do projeto React/Vite
      - name: Instalar dependencias Web
        run: |
          echo "Instalando dependencias com Bun..."
          bun install --frozen-lockfile || bun install

      # 5. Compilar o frontend Web Vite (gera dist/)
      - name: Compilar frontend Web (Vite)
        run: |
          echo "Compilando versao web para pasta dist/..."
          bun run build
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::Pasta dist ausente ou vazia apos o build do Vite!"
            exit 1
          fi
          echo "Build Vite concluido com sucesso."

      # 6. Sincronizar assets do frontend no projeto Android
      - name: Sincronizar assets Web no Android
        run: |
          echo "Copiando bundle web para android/app/src/main/assets/public/..."
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copiados. Total de itens:"
          ls -lh android/app/src/main/assets/public/ | head -15

      # 7. Configurar Java 17 JDK
      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Configurar Gradle oficial
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      # 9. Decodificar Keystore de produção caso secrets estejam presentes
      - name: Configurar Assinatura do Keystore
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f android/release.keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
            if [ -s "$GITHUB_WORKSPACE/android/release.keystore" ]; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "keystore_path=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_OUTPUT"
              echo "Keystore de release decodificado com sucesso ($(wc -c < "$GITHUB_WORKSPACE/android/release.keystore") bytes)."
            else
              echo "::warning::Falha na decodificacao do KEYSTORE_BASE64 (arquivo vazio). O build usara chave de debug."
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
              echo "keystore_path=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::Secrets de assinatura ausentes ou incompletos. O build usara chave de debug."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      # 10. Preparar Gradle Wrapper oficial
      - name: Preparar Gradle Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          if command -v gradle >/dev/null 2>&1; then
            echo "Gerando gradle-wrapper via Gradle oficial instalado..."
            gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          fi
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Baixando gradle-wrapper.jar oficial de services.gradle.org..."
            curl -fSL --retry 3 --connect-timeout 15 -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.2.1-wrapper.jar || true
          fi
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar nao pode ser gerado nem baixado!"
            exit 1
          fi
          chmod +x gradlew
          echo "Testando gradlew --version:"
          ./gradlew --version

      # 11. Compilar APK Android com Gradle (falha real = falha do job)
      - name: Compilar APK Android com Gradle
        env:
          KEYSTORE_FILE: ${{ steps.setup_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TYPE_INPUT: ${{ github.event.inputs.build_type }}
        run: |
          cd android
          chmod +x gradlew

          BUILD_MODE="${BUILD_TYPE_INPUT:-release}"
          echo "=== INICIANDO COMPILACAO GRADLE (MODO: $BUILD_MODE) ==="

          if [ "$BUILD_MODE" = "release" ]; then
            echo "Executando ./gradlew assembleRelease --no-daemon --stacktrace..."
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              echo "assembleRelease concluido com sucesso."
            else
              echo "::warning::assembleRelease falhou. Tentando fallback para assembleDebug..."
              ./gradlew assembleDebug --no-daemon --stacktrace
            fi
          else
            echo "Executando ./gradlew assembleDebug --no-daemon --stacktrace..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # 12. Verificar APK gerado (FALHA explicitamente se nenhum APK existir)
      - name: Verificar APK gerado
        run: |
          echo "=== VERIFICACAO DE ARQUIVOS APK GERADOS ==="
          APK_COUNT=0
          if [ -d "android/app/build/outputs/apk" ]; then
            find android/app/build/outputs/apk -type f -name "*.apk" -ls
            APK_COUNT=$(find android/app/build/outputs/apk -type f -name "*.apk" | wc -l)
          fi

          echo "Total de APKs encontrados: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::FALHA CRITICA: Nenhum arquivo APK foi gerado pelo processo Gradle!"
            exit 1
          fi

          echo "Lista de APKs gerados:"
          find android/app/build/outputs/apk -type f -name "*.apk"

      # 13. Publicar o APK gerado como artefato do GitHub Actions
      - name: Publicar APK no GitHub Actions (rotaly-apk)
        uses: actions/upload-artifact@v4
        with:
          name: rotaly-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
