name: Criar APK para Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build (release ou debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - principal
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Criar APK para Android
    runs-on: ubuntu-24.04
    # Blinda contra execuções disparadas por sincronizações automáticas com mensagem "Auto-commit before sync"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, 'Auto-commit before sync') &&
       !contains(github.event.head_commit.message, 'Confirmação automática antes da sincronização'))

    steps:
      # 1. Checkout do repositório
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      # 2. Diagnóstico inicial do ambiente
      - name: Diagnostico do ambiente
        run: |
          echo "=== DIAGNOSTICO DO RUNNER (Ubuntu 24.04) ==="
          uname -a
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Commit Message: ${{ github.event.head_commit.message }}"
          echo "--- Estrutura raiz ---"
          ls -la
          echo "--- Estrutura android/ ---"
          ls -la android/
          echo "=== FIM DO DIAGNOSTICO ==="

      # 3. Configurar Node.js oficial (LTS v20) para o build web
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 4. Instalar dependências Web do projeto React/Vite com npm ci
      - name: Instalar dependencias Web
        run: |
          echo "Instalando dependencias com npm ci..."
          npm ci || npm install --legacy-peer-deps

      # 5. Compilar o frontend Web Vite (gera dist/)
      - name: Compilar frontend Web (Vite)
        run: |
          echo "Compilando versao web para pasta dist/..."
          npm run build
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::Pasta dist ausente ou vazia apos o build do Vite!"
            exit 1
          fi
          echo "Build Vite concluido com sucesso."

      # 6. Sincronizar assets do frontend e metadados no projeto Android
      - name: Sincronizar assets Web no Android
        run: |
          echo "Copiando bundle web para android/app/src/main/assets/public/..."
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          echo "Sincronizando capacitor.config.json no assets do Android..."
          cat << 'EOF' > android/app/src/main/assets/capacitor.config.json
          {
            "appId": "br.com.rotaly.app",
            "appName": "Rotaly",
            "webDir": "public",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://www.rotaly.com.br",
              "androidScheme": "https",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false,
              "backgroundColor": "#0E1738"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              }
            }
          }
          EOF
          echo "Assets copiados. Total de itens em public/:"
          ls -lh android/app/src/main/assets/public/ | head -15

      # 7. Configurar Java 17 (JDK Temurin) com setup-java@v5
      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Aceitar licenças do Android SDK e instalar plataformas/build-tools obrigatórias
      - name: Aceitar licencas e instalar Android SDK Platform 34 e Build-Tools
        run: |
          echo "=== CONFIGURANDO ANDROID SDK MANAGER E LICENCAS ==="
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
          fi
          echo "Usando Android SDK em: $SDK_DIR"

          SDKMANAGER_BIN=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_BIN="$(command -v sdkmanager)"
          elif [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER_BIN="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi

          if [ -n "$SDKMANAGER_BIN" ] && [ -x "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager localizado em: $SDKMANAGER_BIN"
            echo "Aceitando todas as licencas do Android SDK..."
            yes | "$SDKMANAGER_BIN" --licenses || true
            echo "Instalando components necessarios: platform-tools, platforms;android-34, build-tools;34.0.0..."
            "$SDKMANAGER_BIN" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "::warning::sdkmanager binario nao encontrado em $SDK_DIR. Criando licencas manualmente..."
          fi

          # Garantir diretorio de licencas e hashes oficiais aceitos preventivamente
          mkdir -p "$SDK_DIR/licenses"
          echo -e "\n24333f8a63b1d7f2e51fa81f12b0452f0537b8a6\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b1d7f2e51fa81f12b0452f0537b8a6" > "$SDK_DIR/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$SDK_DIR/licenses/android-sdk-preview-license" || true
          echo "Licencas configuradas com sucesso."

      # 9. Configurar Gradle oficial com setup-gradle@v4
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      # 10. Decodificar Keystore de produção caso secrets estejam presentes
      - name: Configurar Assinatura do Keystore
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f android/release.keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
            if [ -s "$GITHUB_WORKSPACE/android/release.keystore" ]; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "keystore_path=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_OUTPUT"
              echo "Keystore de release decodificado com sucesso ($(wc -c < "$GITHUB_WORKSPACE/android/release.keystore") bytes)."
            else
              echo "::warning::Falha na decodificacao do KEYSTORE_BASE64 (arquivo vazio). O build usara chave de debug."
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
              echo "keystore_path=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::Secrets de assinatura ausentes ou incompletos. O build usara chave de debug."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
          fi

      # 11. Preparar Gradle Wrapper oficial (8.2.1)
      - name: Preparar Gradle Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          if command -v gradle >/dev/null 2>&1; then
            echo "Gerando gradle-wrapper via Gradle oficial instalado..."
            gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          fi
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Baixando gradle-wrapper.jar oficial de services.gradle.org..."
            curl -fSL --retry 3 --connect-timeout 15 -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.2.1-wrapper.jar || true
          fi
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar nao pode ser gerado nem baixado!"
            exit 1
          fi
          chmod +x gradlew
          echo "Testando gradlew --version:"
          ./gradlew --version

      # 12. Compilar APK Android com Gradle (com extração obrigatória de causas de erro e log detalhado)
      - name: Compilar APK Android com Gradle
        id: gradle_build
        env:
          KEYSTORE_FILE: ${{ steps.setup_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TYPE_INPUT: ${{ github.event.inputs.build_type }}
        run: |
          cd android
          chmod +x gradlew

          BUILD_MODE="${BUILD_TYPE_INPUT:-release}"
          echo "=== INICIANDO COMPILACAO GRADLE (MODO: $BUILD_MODE) ==="

          GRADLE_LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"
          touch "$GRADLE_LOG_FILE"

          run_gradle_task() {
            local task_name="$1"
            echo "Executando ./gradlew $task_name --no-daemon --stacktrace --warning-mode all ..."
            if ./gradlew "$task_name" --no-daemon --stacktrace --warning-mode all 2>&1 | tee -a "$GRADLE_LOG_FILE"; then
              echo "Tarefa $task_name concluida com sucesso."
              return 0
            else
              local exit_code=$?
              echo "::error::Tarefa $task_name FALHOU com codigo de saida $exit_code!"

              echo "=== DIAGNOSTICO DETALHADO DO GRADLE: CAUSA RAIZ DA FALHA ==="
              if grep -n -E "FAILURE: Build failed|What went wrong:|Caused by:|AAPT: error:" "$GRADLE_LOG_FILE" >/dev/null 2>&1; then
                echo "--- Secao 'FAILURE: Build failed / What went wrong:' ---"
                grep -A 20 -E "FAILURE: Build failed|What went wrong:" "$GRADLE_LOG_FILE" || true
                echo "----------------------------------------------------"
                echo "--- Ocorrencias de 'Caused by:' ---"
                grep -A 10 -E "Caused by:" "$GRADLE_LOG_FILE" | head -n 40 || true
                echo "----------------------------------------------------"
                echo "--- Ocorrencias de 'AAPT: error' ---"
                grep -A 10 -E "AAPT: error" "$GRADLE_LOG_FILE" | head -n 40 || true

                # Injeta anotacao estruturada no GitHub Actions com o bloco de causa raiz
                local failure_summary
                failure_summary=$(grep -A 15 "What went wrong:" "$GRADLE_LOG_FILE" | head -n 15 | tr '\r\n' '  ' | sed 's/"/\\"/g')
                if [ -n "$failure_summary" ]; then
                  echo "::error title=Gradle Root Cause::$failure_summary"
                else
                  local caused_by_summary
                  caused_by_summary=$(grep -A 5 "Caused by:" "$GRADLE_LOG_FILE" | head -n 5 | tr '\r\n' '  ' | sed 's/"/\\"/g')
                  if [ -n "$caused_by_summary" ]; then
                    echo "::error title=Gradle Caused By::$caused_by_summary"
                  fi
                fi
              else
                echo "Cabecalho padrao nao encontrado nos padroes conhecidos."
              fi
              echo "=== FIM DO DIAGNOSTICO DETALHADO ==="

              echo "=== ULTIMAS 150 LINHAS DO LOG GRADLE ($task_name) ==="
              tail -n 150 "$GRADLE_LOG_FILE"
              echo "=== FIM DO LOG GRADLE ==="
              return $exit_code
            fi
          }

          if [ "$BUILD_MODE" = "release" ]; then
            if ! run_gradle_task "assembleRelease"; then
              echo "::warning::assembleRelease falhou. Tentando fallback para assembleDebug para inspecao..."
              if ! run_gradle_task "assembleDebug"; then
                echo "::error::Tanto assembleRelease quanto assembleDebug falharam. Encerrando com erro."
                exit 1
              fi
            fi
          else
            if ! run_gradle_task "assembleDebug"; then
              echo "::error::assembleDebug falhou. Encerrando com erro."
              exit 1
            fi
          fi

      # 13. Fazer upload do log do Gradle como artefato SEMPRE (sucesso ou falha)
      - name: Salvar log completo do Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7
          if-no-files-found: ignore

      # 14. Verificar APK gerado (FALHA explicitamente se nenhum APK existir)
      - name: Verificar APK gerado
        run: |
          echo "=== VERIFICACAO DE ARQUIVOS APK GERADOS ==="
          APK_COUNT=0
          if [ -d "android/app/build/outputs/apk" ]; then
            find android/app/build/outputs/apk -type f -name "*.apk" -ls
            APK_COUNT=$(find android/app/build/outputs/apk -type f -name "*.apk" | wc -l)
          fi

          echo "Total de APKs encontrados: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::FALHA CRITICA: Nenhum arquivo APK foi gerado pelo processo Gradle!"
            exit 1
          fi

          echo "Lista de APKs gerados com sucesso:"
          find android/app/build/outputs/apk -type f -name "*.apk"

      # 15. Publicar o APK gerado como artefato do GitHub Actions
      - name: Publicar APK no GitHub Actions (rotaly-apk)
        uses: actions/upload-artifact@v4
        with:
          name: rotaly-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
