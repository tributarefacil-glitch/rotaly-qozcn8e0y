name: Criar APK para Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build a compilar'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: apk-build-dispatch
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    # Guarda estrita: roda SOMENTE em disparo manual workflow_dispatch.
    # Qualquer outro evento e ignorado (skipped com sucesso, sem gerar falha).
    if: github.event_name == 'workflow_dispatch'

    steps:
      # 1. Checkout do repositório
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 2. Diagnóstico inicial do ambiente runner e inicialização de logs
      - name: Diagnostico do ambiente e preparacao de logs
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          GRADLE_LOG="$GITHUB_WORKSPACE/gradle-build.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          touch "$SETUP_LOG" "$GRADLE_LOG" "$STEP_LOGS"

          {
            echo "=== DIAGNOSTICO DO RUNNER (Ubuntu 24.04) ==="
            date -u
            uname -a
            echo "ANDROID_HOME=${ANDROID_HOME:-nao definido}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-nao definido}"
            echo "JAVA_HOME=${JAVA_HOME:-nao definido}"
            echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
            echo "Commit SHA: ${{ github.sha }}"
            echo "Branch / Ref: ${{ github.ref }}"
            echo "Disparado por: ${{ github.actor }}"
            echo "Build Type solicitado: ${{ github.event.inputs.build_type || 'release' }}"
            echo "--- Conteudo raiz ---"
            ls -la
            echo "--- Conteudo android-overlay/ ---"
            if [ -d "android-overlay" ]; then
              find android-overlay -maxdepth 4 -ls
            else
              echo "::error::Diretorio android-overlay ausente no checkout!"
              exit 1
            fi
            echo "=== FIM DO DIAGNOSTICO INICIAL ==="
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # 3. Configurar Node.js oficial (Node 20 LTS - altamente estável para Capacitor 6/7 e npm)
      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Instalar dependências Web do projeto React/Vite com fallback robusto e dump de erro
      - name: Instalar dependencias Web
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          {
            echo "=== [PASSO 4] INSTALACAO DE DEPENDENCIAS WEB ==="
            node -v
            npm -v

            # Tenta múltiplos métodos de instalação para garantir sucesso com ou sem lockfile
            INSTALLED=false

            if [ -f "package-lock.json" ]; then
              echo "package-lock.json encontrado. Tentando 'npm ci'..."
              if npm ci --prefer-offline 2>&1; then
                echo "'npm ci' concluiu com sucesso."
                INSTALLED=true
              else
                echo "::warning::'npm ci' falhou. Tentando fallback para 'npm install --legacy-peer-deps'..."
              fi
            fi

            if [ "$INSTALLED" = "false" ]; then
              echo "Executando: npm install --legacy-peer-deps --no-audit --no-fund..."
              if npm install --legacy-peer-deps --no-audit --no-fund 2>&1; then
                echo "'npm install' concluiu com sucesso."
                INSTALLED=true
              else
                echo "::warning::'npm install --legacy-peer-deps' falhou. Tentando fallback final com --force..."
                if npm install --force --no-audit --no-fund 2>&1; then
                  echo "'npm install --force' concluiu com sucesso."
                  INSTALLED=true
                fi
              fi
            fi

            if [ "$INSTALLED" = "false" ]; then
              echo "::error::Falha critica na instalacao de dependencias npm!"
              if [ -d "$HOME/.npm/_logs" ]; then
                echo "--- Ultimo log do npm ---"
                tail -n 60 "$HOME/.npm/_logs"/*.log 2>/dev/null || true
              fi
              exit 1
            fi

            echo "Dependencias Web instaladas com exito."
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # 5. Compilar o frontend Web Vite (gera dist/)
      - name: Compilar frontend Web (Vite)
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          {
            echo "=== [PASSO 5] COMPILACAO VITE (FRONTEND) ==="
            npm run build 2>&1
            if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
              echo "::error::Pasta dist ausente ou vazia apos o build do Vite!"
              exit 1
            fi
            echo "Build Vite concluido com sucesso. Total de arquivos em dist/: $(find dist -type f | wc -l)"
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # 5b. Pre-checagem e Preparacao de Configuracao do Capacitor
      - name: Pre-checagem do ambiente e geracao do capacitor.config.json
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          {
            echo "=== [PASSO 5b] PRE-CHECAGEM DO AMBIENTE CAPACITOR ==="
            echo "Node: $(node --version)"
            echo "NPM: $(npm --version)"

            echo "Verificando integridade de dist/:"
            if [ ! -f "dist/index.html" ]; then
              echo "::error::Arquivo dist/index.html obrigatorio nao encontrado!"
              exit 1
            fi
            echo "dist/index.html confirmado com $(wc -c < dist/index.html) bytes."

            echo "Garantindo capacitor.config.json canônico (sem dependencia de ts-node)..."
            node scripts/prepare-capacitor-config.mjs

            if [ ! -f "capacitor.config.json" ]; then
              echo "::error::Falha ao gerar capacitor.config.json!"
              exit 1
            fi
            echo "Conteudo do capacitor.config.json:"
            cat capacitor.config.json

            echo "Garantindo pacotes @capacitor/cli e @capacitor/android no node_modules..."
            CAP_MISSING=false
            if [ ! -d "node_modules/@capacitor/cli" ]; then
              echo "Aviso: node_modules/@capacitor/cli ausente."
              CAP_MISSING=true
            fi
            if [ ! -d "node_modules/@capacitor/android" ]; then
              echo "Aviso: node_modules/@capacitor/android ausente."
              CAP_MISSING=true
            fi

            if [ "$CAP_MISSING" = "true" ]; then
              echo "Instalando @capacitor/cli e @capacitor/android explicitamente..."
              npm install --legacy-peer-deps --no-save --no-audit --no-fund @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
            fi

            echo "Versao do Capacitor CLI: $(npx cap --version 2>&1 || echo 'falha ao obter versao')"
            echo "Pre-checagem do ambiente Capacitor concluida com sucesso."
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # 6. ESTRATÉGIA AUTORREGENERATIVA: Regenerar esqueleto Android canônico do zero
      # Remove qualquer pasta android/ pré-existente e recria via Capacitor CLI, aplicando overlay
      - name: Regenerar esqueleto Android canonico com overlay
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          GRADLE_LOG="$GITHUB_WORKSPACE/gradle-build.log"

          log_cmd() {
            local step_name="$1"
            shift
            echo "--- [SUB-PASSO] $step_name ---"
            set +e
            "$@"
            local err_code=$?
            set -e
            if [ "$err_code" -ne 0 ]; then
              local msg="FALHA no sub-passo '$step_name' com codigo de saida $err_code ao executar: $*"
              echo "::error::$msg"
              echo "=== FALHA NA REGENERACAO DO PROJETO ANDROID ===" >> "$GRADLE_LOG"
              echo "$msg" >> "$GRADLE_LOG"
              echo "O Gradle nao foi iniciado porque a etapa de regeneracao falhou antes da compilacao." >> "$GRADLE_LOG"
              exit "$err_code"
            fi
            echo "SUCESSO: $step_name (codigo de saida: $err_code)"
          }

          {
            echo "=== [PASSO 6] REGENERACAO AUTORREGENERATIVA DO ANDROID ==="

            # 6.1 Limpeza completa do diretório android existente
            log_cmd "Remover android/ pre-existente" rm -rf android

            # 6.2 Adicionar plataforma Android via Capacitor CLI
            log_cmd "Adicionar plataforma Android (npx cap add android)" npx cap add android

            # 6.3 Aplicar overlay nativo personalizado do Rotaly
            echo "--- [SUB-PASSO] Aplicar android-overlay sobre android/ ---"
            if [ ! -d "android-overlay" ]; then
              echo "::error::Diretorio android-overlay ausente no repositorio!"
              echo "FALHA: android-overlay ausente" >> "$GRADLE_LOG"
              exit 1
            fi
            cp -r android-overlay/* android/
            echo "Overlay nativo copiado com sucesso sobre android/."

            # 6.4 Sincronizar configuracoes e assets com Capacitor CLI
            log_cmd "Sincronizar plataforma Android (npx cap sync android)" npx cap sync android

            # 6.4b Se houver sincronizacao interna ou script que execute git commit antes do build,
            # forcar configuracao e mensagem com [skip ci] para que o GitHub nunca dispare pipeline a partir dele
            if [ -d ".git" ]; then
              git config --global user.name "github-actions[bot]" || true
              git config --global user.email "github-actions[bot]@users.noreply.github.com" || true
            fi
            if git status --porcelain 2>/dev/null | grep -q .; then
              echo "Status git pos-sync detectado. Garantindo commit com [skip ci] caso auto-commit seja invocado:"
              git add -A || true
              git commit -m "Auto-commit before sync [skip ci]" || true
            fi

            # 6.5 Garantir capacitor.config.json dentro de assets do app
            echo "--- [SUB-PASSO] Sincronizar capacitor.config.json em assets ---"
            mkdir -p android/app/src/main/assets
            cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

            # 6.6 Copiar build web recente para assets/public
            echo "--- [SUB-PASSO] Copiar dist/ para assets/public ---"
            mkdir -p android/app/src/main/assets/public
            cp -r dist/* android/app/src/main/assets/public/

            # 6.7 Validar arquivos essenciais gerados
            echo "--- [SUB-PASSO] Validar estrutura do projeto Android ---"
            if [ ! -f "android/build.gradle" ]; then
              echo "::error::android/build.gradle nao foi gerado!"
              exit 1
            fi
            if [ ! -f "android/app/build.gradle" ]; then
              echo "::error::android/app/build.gradle nao foi gerado!"
              exit 1
            fi
            if [ ! -f "android/app/src/main/java/br/com/rotaly/app/MainActivity.java" ]; then
              echo "::error::MainActivity.java ausente no pacote br.com.rotaly.app!"
              exit 1
            fi

            echo "Conferindo arquivos em android/app/src/main/java/br/com/rotaly/app/:"
            ls -la android/app/src/main/java/br/com/rotaly/app/ || true
            ls -la android/app/src/main/java/br/com/rotaly/app/services/ || true
            echo "Regeneracao do projeto Android concluida com 100% de exito."
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # 7. Configurar Java 17 (JDK Temurin)
      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 8. Aceitar licenças do Android SDK e instalar platforms;android-34 + build-tools;34.0.0
      - name: Aceitar licencas e instalar Android SDK Platform 34 e Build-Tools
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          {
            echo "=== [PASSO 8] CONFIGURACAO DO ANDROID SDK E LICENCAS ==="
            SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            if [ -z "$SDK_DIR" ]; then
              SDK_DIR="/usr/local/lib/android/sdk"
            fi
            echo "Usando Android SDK em: $SDK_DIR"

            SDKMANAGER_BIN=""
            if command -v sdkmanager >/dev/null 2>&1; then
              SDKMANAGER_BIN="$(command -v sdkmanager)"
            elif [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            else
              SDKMANAGER_BIN="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
            fi

            if [ -n "$SDKMANAGER_BIN" ] && [ -x "$SDKMANAGER_BIN" ]; then
              echo "sdkmanager localizado em: $SDKMANAGER_BIN"
              echo "Aceitando licencas do Android SDK..."
              yes | "$SDKMANAGER_BIN" --licenses || true
              echo "Instalando componentes necessarios..."
              "$SDKMANAGER_BIN" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
            else
              echo "::warning::sdkmanager binario nao encontrado em $SDK_DIR. Aplicando hashes manuais..."
            fi

            mkdir -p "$SDK_DIR/licenses"
            echo -e "\n24333f8a63b1d7f2e51fa81f12b0452f0537b8a6\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b1d7f2e51fa81f12b0452f0537b8a6" > "$SDK_DIR/licenses/android-sdk-license" || true
            echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$SDK_DIR/licenses/android-sdk-preview-license" || true
            echo "Licencas configuradas com sucesso."
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # 9. Configurar Gradle oficial
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      # 10. Decodificar Keystore de produção dos secrets do repositório
      - name: Configurar Assinatura do Keystore
        id: setup_keystore
        env:
          KEYSTORE_FILE_SECRET: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          {
            echo "=== [PASSO 10] CONFIGURACAO DO KEYSTORE ==="
            rm -f android/release.keystore
            B64_DATA="${KEYSTORE_FILE_SECRET:-$KEYSTORE_BASE64_SECRET}"

            if [ -n "$B64_DATA" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              echo "$B64_DATA" | tr -d '\r\n ' | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
              if [ -s "$GITHUB_WORKSPACE/android/release.keystore" ]; then
                echo "has_keystore=true" >> "$GITHUB_OUTPUT"
                echo "keystore_path=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_OUTPUT"
                echo "Keystore de release decodificado com sucesso ($(wc -c < "$GITHUB_WORKSPACE/android/release.keystore") bytes)."
              else
                echo "::warning::Falha na decodificacao do Keystore (arquivo vazio). Release usara fallback."
                echo "has_keystore=false" >> "$GITHUB_OUTPUT"
                echo "keystore_path=" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::notice::Secrets de assinatura ausentes ou incompletos. Release usara fallback de debug."
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
              echo "keystore_path=" >> "$GITHUB_OUTPUT"
            fi
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # 11. Preparar Gradle Wrapper oficial (8.2.1)
      - name: Preparar Gradle Wrapper
        run: |
          set -eo pipefail
          SETUP_LOG="$GITHUB_WORKSPACE/setup-diagnostic.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          GRADLE_LOG="$GITHUB_WORKSPACE/gradle-build.log"
          {
            echo "=== [PASSO 11] PREPARACAO DO GRADLE WRAPPER ==="
            cd android
            mkdir -p gradle/wrapper
            if command -v gradle >/dev/null 2>&1; then
              echo "Gerando gradle-wrapper via Gradle oficial instalado..."
              gradle wrapper --gradle-version 8.2.1 --distribution-type bin
            fi
            if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "Baixando gradle-wrapper.jar oficial de services.gradle.org..."
              curl -fSL --retry 3 --connect-timeout 15 -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.2.1-wrapper.jar || true
            fi
            if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "::error::gradle-wrapper.jar nao pode ser gerado nem baixado!"
              echo "FALHA: gradle-wrapper.jar ausente" >> "$GRADLE_LOG"
              exit 1
            fi

            echo "Garantindo permissao de execucao no gradlew..."
            chmod +x gradlew
            if [ ! -x "./gradlew" ]; then
              echo "::error::android/gradlew nao possui permissao executavel!"
              echo "FALHA: android/gradlew nao executavel" >> "$GRADLE_LOG"
              exit 1
            fi

            echo "Testando gradlew --version:"
            ./gradlew --version
            echo "Gradle Wrapper 8.2.1 pronto e operacional."
          } 2>&1 | tee -a "$SETUP_LOG" "$STEP_LOGS"

      # =========================================================================
      # ETAPA 1: COMPILAÇÃO DO APK DEBUG (GARANTIA TOTAL DE ENTREGÁVEL NATIVO)
      # =========================================================================
      - name: Etapa 1 - Compilar APK Debug (assembleDebug)
        id: build_debug
        run: |
          set -eo pipefail
          GRADLE_LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          cd android
          chmod +x gradlew

          echo "=== [ETAPA 1/2] COMPILANDO APK DEBUG ===" | tee -a "$STEP_LOGS"
          echo -e "\n=== LOG ETAPA 1: assembleDebug ($(date -u)) ===" >> "$GRADLE_LOG_FILE"

          BUILD_DEBUG_FAILED=false
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee -a "$GRADLE_LOG_FILE" "$STEP_LOGS" || BUILD_DEBUG_FAILED=true

          if [ "$BUILD_DEBUG_FAILED" = "true" ]; then
            echo "::error::FALHA CRITICA no assembleDebug!"
            if grep -n -E "FAILURE: Build failed|What went wrong:|Caused by:" "$GRADLE_LOG_FILE" >/dev/null 2>&1; then
              ROOT_CAUSE=$(grep -A 10 "What went wrong:" "$GRADLE_LOG_FILE" | head -n 10 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$ROOT_CAUSE" ] && echo "::error title=Gradle Root Cause (Debug)::$ROOT_CAUSE"
              CAUSED_BY=$(grep -A 5 "Caused by:" "$GRADLE_LOG_FILE" | head -n 5 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$CAUSED_BY" ] && echo "::error title=Gradle Caused By (Debug)::$CAUSED_BY"
            fi
            exit 1
          fi

          echo "assembleDebug concluido com sucesso."
          echo "=== CONFERINDO APK DEBUG GERADO ==="
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Nenhum APK debug encontrado apos assembleDebug!"
            exit 1
          fi
          echo "APK Debug gerado com sucesso: $DEBUG_APK ($(ls -lh "$DEBUG_APK" | awk '{print $5}'))" | tee -a "$STEP_LOGS"

      # 13. Publicar imediatamente o APK Debug como artifact rotaly-apk-debug
      - name: Publicar artifact rotaly-apk-debug
        uses: actions/upload-artifact@v6
        with:
          name: rotaly-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # =========================================================================
      # ETAPA 2: COMPILAÇÃO DO APK RELEASE (ASSINADO)
      # =========================================================================
      - name: Etapa 2 - Compilar APK Release (assembleRelease)
        id: build_release
        continue-on-error: true
        env:
          KEYSTORE_FILE: ${{ steps.setup_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eo pipefail
          GRADLE_LOG_FILE="$GITHUB_WORKSPACE/gradle-build.log"
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          cd android
          chmod +x gradlew

          echo "=== [ETAPA 2/2] COMPILANDO APK RELEASE ===" | tee -a "$STEP_LOGS"
          echo -e "\n\n=== LOG ETAPA 2: assembleRelease ($(date -u)) ===" >> "$GRADLE_LOG_FILE"

          if [ "${{ steps.setup_keystore.outputs.has_keystore }}" != "true" ]; then
            echo "::warning::Keystore nao configurado via secrets; build release caira no fallback de debug configurado no build.gradle."
          fi

          BUILD_RELEASE_FAILED=false
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee -a "$GRADLE_LOG_FILE" "$STEP_LOGS" || BUILD_RELEASE_FAILED=true

          if [ "$BUILD_RELEASE_FAILED" = "false" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
            if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
              echo "assembleRelease concluido com sucesso: $RELEASE_APK ($(ls -lh "$RELEASE_APK" | awk '{print $5}'))" | tee -a "$STEP_LOGS"
              echo "release_success=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Release Sem APK::assembleRelease terminou sem gerar arquivo APK em app/build/outputs/apk/release."
              echo "release_success=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "::warning title=Falha no Release::RELEASE falhou, APK debug disponivel no artifact rotaly-apk-debug."
            if grep -n -E "FAILURE: Build failed|What went wrong:|Caused by:" "$GRADLE_LOG_FILE" >/dev/null 2>&1; then
              ROOT_CAUSE=$(grep -A 10 "What went wrong:" "$GRADLE_LOG_FILE" | head -n 10 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$ROOT_CAUSE" ] && echo "::warning title=Gradle Root Cause (Release)::$ROOT_CAUSE"
              CAUSED_BY=$(grep -A 5 "Caused by:" "$GRADLE_LOG_FILE" | head -n 5 | tr '\r\n' '  ' | sed 's/"/\\"/g')
              [ -n "$CAUSED_BY" ] && echo "::warning title=Gradle Caused By (Release)::$CAUSED_BY"
            fi
            echo "release_success=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # 15. Publicar o APK Release assinado como artifact (quando concluído com sucesso)
      - name: Publicar artifact rotaly-apk-release
        if: steps.build_release.outcome == 'success' && steps.build_release.outputs.release_success == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: rotaly-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      # =========================================================================
      # ETAPA 3: PUBLICAR RELEASE ESTÁVEL NO GITHUB (LINK FIXO apk-latest)
      # =========================================================================
      - name: Preparar e Publicar GitHub Release estavel (apk-latest)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          STEP_LOGS="$GITHUB_WORKSPACE/step-logs.log"
          {
            echo "=== [ETAPA 3] PUBLICACAO DO GITHUB RELEASE (apk-latest) ==="
            RELEASE_DIR="$GITHUB_WORKSPACE/release-dist"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            RELEASE_SOURCE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
            DEBUG_SOURCE=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1 || true)

            if [ -n "$RELEASE_SOURCE" ] && [ -f "$RELEASE_SOURCE" ]; then
              cp "$RELEASE_SOURCE" "$RELEASE_DIR/Rotaly.apk"
              echo "APK Release preparado: $RELEASE_DIR/Rotaly.apk ($(ls -lh "$RELEASE_DIR/Rotaly.apk" | awk '{print $5}'))"
            else
              echo "::warning::APK Release assinado nao encontrado. Usando APK Debug como fallback de Rotaly.apk para garantir download funcional!"
              if [ -n "$DEBUG_SOURCE" ] && [ -f "$DEBUG_SOURCE" ]; then
                cp "$DEBUG_SOURCE" "$RELEASE_DIR/Rotaly.apk"
              fi
            fi

            if [ -n "$DEBUG_SOURCE" ] && [ -f "$DEBUG_SOURCE" ]; then
              cp "$DEBUG_SOURCE" "$RELEASE_DIR/Rotaly-teste.apk"
              echo "APK Debug preparado: $RELEASE_DIR/Rotaly-teste.apk ($(ls -lh "$RELEASE_DIR/Rotaly-teste.apk" | awk '{print $5}'))"
            fi

            if [ ! -f "$RELEASE_DIR/Rotaly.apk" ] && [ ! -f "$RELEASE_DIR/Rotaly-teste.apk" ]; then
              echo "::error::Nenhum arquivo APK valido encontrado para publicar no GitHub Release!"
              exit 1
            fi

            TAG_NAME="apk-latest"
            RELEASE_TITLE="Rotaly APK - Versao Mais Recente"
            RELEASE_BODY="### Rotaly Android - Download Direto Oficial

Link estavel e permanente com a build mais recente compilada via GitHub Actions.

#### Arquivos disponiveis:
- **Rotaly.apk**: Versao oficial de producao. Instala diretamente por cima da versao anterior sem perder dados.
- **Rotaly-teste.apk**: Versao de teste (debug).

*Build gerada automaticamente em $(date -u '+%d/%m/%Y %H:%M:%S UTC') a partir do commit \`${{ github.sha }}\`.*"

            echo "Garantindo tag $TAG_NAME local e remota..."
            git config --global user.name "github-actions[bot]" || true
            git config --global user.email "github-actions[bot]@users.noreply.github.com" || true
            git tag -f "$TAG_NAME" "${{ github.sha }}" || true
            git push -f origin "$TAG_NAME" || echo "Aviso: push da tag via git falhou, prosseguindo com gh release create que cria a tag automaticamente."

            FILES_TO_UPLOAD=()
            [ -f "$RELEASE_DIR/Rotaly.apk" ] && FILES_TO_UPLOAD+=("$RELEASE_DIR/Rotaly.apk")
            [ -f "$RELEASE_DIR/Rotaly-teste.apk" ] && FILES_TO_UPLOAD+=("$RELEASE_DIR/Rotaly-teste.apk")

            echo "Tentando atualizar ou criar release com gh CLI..."
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME ja existe. Fazendo upload/atualizacao dos assets (--clobber)..."
              gh release upload "$TAG_NAME" "${FILES_TO_UPLOAD[@]}" --clobber || {
                echo "Upload falhou, tentando recriar release..."
                gh release delete "$TAG_NAME" --yes || true
                gh release create "$TAG_NAME" \
                  "${FILES_TO_UPLOAD[@]}" \
                  --title "$RELEASE_TITLE" \
                  --notes "$RELEASE_BODY" \
                  --latest=true
              }
            else
              echo "Criando novo release $TAG_NAME..."
              gh release create "$TAG_NAME" \
                "${FILES_TO_UPLOAD[@]}" \
                --title "$RELEASE_TITLE" \
                --notes "$RELEASE_BODY" \
                --latest=true
            fi

            echo "GitHub Release $TAG_NAME publicado com sucesso!"
            gh release view "$TAG_NAME" || true
          } 2>&1 | tee -a "$STEP_LOGS"

      # =========================================================================
      # DIAGNÓSTICO E LOGS COMPLETOS (PUBLICADOS SEMPRE COM if: always())
      # =========================================================================
      - name: Publicar log de setup e diagnostico do ambiente
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: setup-diagnostic-log
          path: setup-diagnostic.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar log de etapas pos-Vite
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: step-logs
          path: step-logs.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar log completo do Gradle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 14
          if-no-files-found: ignore

      # =========================================================================
      # VERIFICAÇÃO FINAL: FALHAR CASO NENHUM APK TENHA SIDO PRODUZIDO
      # =========================================================================
      - name: Resumo e Verificacao Final do Build
        if: always()
        run: |
          echo "=== RESUMO DO BUILD DO ROTALY APK ==="
          DEBUG_EXISTS=false
          RELEASE_EXISTS=false

          if [ -d "android/app/build/outputs/apk/debug" ] && [ -n "$(find android/app/build/outputs/apk/debug -type f -name '*.apk' 2>/dev/null)" ]; then
            DEBUG_EXISTS=true
            echo "STATUS DEBUG: SUCESSO (Artifact rotaly-apk-debug disponivel)"
            find android/app/build/outputs/apk/debug -type f -name "*.apk" -ls
          else
            echo "STATUS DEBUG: FALHOU OU AUSENTE"
          fi

          if [ -d "android/app/build/outputs/apk/release" ] && [ -n "$(find android/app/build/outputs/apk/release -type f -name '*.apk' 2>/dev/null)" ]; then
            RELEASE_EXISTS=true
            echo "STATUS RELEASE: SUCESSO (Artifact rotaly-apk-release disponivel)"
            find android/app/build/outputs/apk/release -type f -name "*.apk" -ls
          else
            echo "STATUS RELEASE: NAO GERADO OU FALHOU (Usar APK debug como plano B)"
          fi

          if [ "$DEBUG_EXISTS" = "false" ] && [ "$RELEASE_EXISTS" = "false" ]; then
            echo "::error::Nenhum APK (debug ou release) foi gerado nesta execucao! Build finalizado com erro."
            exit 1
          fi
          echo "Build finalizado com sucesso — pelo menos um APK valido foi gerado e empacotado."
