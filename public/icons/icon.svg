<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001845" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Clean rounded white container matching Rotaly brand -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />

  <!-- The stylized Rotaly "R" Emblem with Navy Blue (#1B3A8C) + Cyan (#00A8E8) chevron & vehicles -->
  <g id="rotaly-symbol" filter="url(#shadow)">
    <!-- Main "R" Spine and Top Loop (Navy Blue #1B3A8C) -->
    <!-- Vertical stem of R -->
    <path d="M 96 112 L 148 112 L 148 340 L 96 340 Z" fill="#1B3A8C" />
    <!-- Top horizontal arm and loop -->
    <path d="M 148 112 L 280 112 C 342 112 376 142 376 198 C 376 250 342 278 280 278 L 148 278 L 148 226 L 276 226 C 308 226 324 212 324 196 C 324 178 308 164 276 164 L 148 164 Z" fill="#1B3A8C" />
    
    <!-- Diagonal right leg of R -->
    <path d="M 232 250 L 372 388 L 312 388 L 192 270 Z" fill="#1B3A8C" />

    <!-- Cyan Chevron Track (#00A8E8) flowing beneath the R -->
    <path d="M 96 364 L 204 290 L 344 398" stroke="#00A8E8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Small Delivery Van / Truck on the left side of Chevron (Navy Blue #1B3A8C) -->
    <g transform="translate(68, 360)">
      <!-- Van Body -->
      <path d="M 0 14 L 0 52 C 0 54 2 56 4 56 L 68 56 C 70 56 72 54 72 52 L 72 32 L 58 14 Z" fill="#1B3A8C" />
      <!-- Van Window -->
      <path d="M 44 20 L 55 20 L 65 33 L 44 33 Z" fill="#FFFFFF" opacity="0.95" />
      <!-- Wheels -->
      <circle cx="16" cy="56" r="10" fill="#0A1128" />
      <circle cx="16" cy="56" r="4" fill="#FFFFFF" />
      <circle cx="54" cy="56" r="10" fill="#0A1128" />
      <circle cx="54" cy="56" r="4" fill="#FFFFFF" />
    </g>

    <!-- Delivery Motorcycle on the right side of Chevron -->
    <g transform="translate(328, 362)">
      <!-- Delivery Top Box (Cyan #00A8E8) -->
      <rect x="0" y="8" width="28" height="26" rx="4" fill="#00A8E8" />
      <!-- Bike Frame & Rider Handlebar (Navy Blue #1B3A8C) -->
      <path d="M 18 32 L 40 32 L 54 18 L 62 18" stroke="#1B3A8C" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M 40 32 L 68 34" stroke="#1B3A8C" stroke-width="6" stroke-linecap="round" fill="none" />
      <!-- Front light / cowl -->
      <circle cx="68" cy="22" r="6" fill="#00A8E8" />
      <!-- Wheels -->
      <circle cx="18" cy="46" r="12" fill="#1B3A8C" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="18" cy="46" r="5" fill="#FFFFFF" />
      <circle cx="70" cy="46" r="12" fill="#1B3A8C" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="70" cy="46" r="5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
