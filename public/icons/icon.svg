<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded edges for app icon -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Subtle accent circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Logistics Delivery Truck & Map Pin Icon Symbol -->
  <g transform="translate(64, 80) scale(0.75)" filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Delivery Box -->
    <path d="M 256,40 L 400,120 L 256,200 L 112,120 Z" fill="rgba(255,255,255,0.25)" />
    <path d="M 112,120 L 112,280 L 256,360 L 256,200" fill="rgba(255,255,255,0.15)" />
    <path d="M 400,120 L 400,280 L 256,360" fill="rgba(255,255,255,0.05)" />
    <path d="M 256,200 L 256,360" />
    <path d="M 184,80 L 328,160" stroke="#60a5fa" stroke-width="16" />
    
    <!-- Speed Lines -->
    <path d="M 40,200 L 80,200" stroke="#38bdf8" stroke-width="18" />
    <path d="M 20,250 L 70,250" stroke="#38bdf8" stroke-width="18" />
    <path d="M 50,300 L 90,300" stroke="#38bdf8" stroke-width="18" />

    <!-- Fast Pin Point -->
    <circle cx="430" cy="340" r="38" fill="#10b981" stroke="#ffffff" stroke-width="12" />
    <path d="M 420,340 L 428,348 L 442,334" stroke="#ffffff" stroke-width="8" />
  </g>
</svg>
