<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Speed lines glow -->
  <path d="M 60 210 L 140 210" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 40 256 L 130 256" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 70 302 L 150 302" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Truck Delivery Icon -->
  <g filter="url(#shadow)">
    <!-- Truck Cargo Body -->
    <rect x="150" y="160" width="180" height="150" rx="16" fill="url(#truckGrad)" />
    
    <!-- Truck Cabin -->
    <path d="M 330 200 L 390 200 C 405 200 415 212 418 228 L 428 270 C 430 282 422 292 410 292 L 330 292 Z" fill="url(#truckGrad)" />
    
    <!-- Cabin Window -->
    <path d="M 345 214 L 382 214 C 390 214 396 220 398 228 L 404 250 L 345 250 Z" fill="#2563eb" opacity="0.85" />
    
    <!-- Delivery Box Logo on Cargo -->
    <rect x="210" y="200" width="60" height="60" rx="8" fill="#2563eb" />
    <path d="M 225 220 L 255 220 M 240 205 L 240 245" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Wheel -->
    <circle cx="210" cy="315" r="38" fill="#0f172a" stroke="#64748b" stroke-width="6"/>
    <circle cx="210" cy="315" r="16" fill="#cbd5e1" />

    <!-- Right Wheel -->
    <circle cx="370" cy="315" r="38" fill="#0f172a" stroke="#64748b" stroke-width="6"/>
    <circle cx="370" cy="315" r="16" fill="#cbd5e1" />

    <!-- Headlight beam -->
    <path d="M 428 275 L 470 265 L 470 295 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- GPS Pin Location Accent -->
  <g transform="translate(350, 90)">
    <circle cx="25" cy="25" r="28" fill="#ef4444" />
    <circle cx="25" cy="25" r="12" fill="#ffffff" />
    <path d="M 25 50 L 25 62" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>