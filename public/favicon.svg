<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean rounded white container matching Rotaly brand -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF" />

  <!-- Main "R" Spine and Top Loop (Navy Blue #1B3A8C) -->
  <path d="M 12 14 L 18 14 L 18 42 L 12 42 Z" fill="#1B3A8C" />
  <path d="M 18 14 L 34 14 C 42 14 46 18 46 25 C 46 31 42 35 34 35 L 18 35 L 18 29 L 34 29 C 38 29 40 27 40 25 C 40 23 38 20 34 20 L 18 20 Z" fill="#1B3A8C" />
  
  <!-- Diagonal right leg of R -->
  <path d="M 28 32 L 46 50 L 39 50 L 23 34 Z" fill="#1B3A8C" />

  <!-- Cyan Chevron Track (#00A8E8) flowing beneath the R -->
  <path d="M 12 46 L 26 36 L 44 50" stroke="#00A8E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Left vehicle (small van in navy) -->
  <rect x="8" y="46" width="9" height="7" rx="1.5" fill="#1B3A8C" />
  <circle cx="10.5" cy="53" r="1.5" fill="#0A1128" />
  <circle cx="14.5" cy="53" r="1.5" fill="#0A1128" />

  <!-- Right vehicle (moto delivery box in cyan + bike) -->
  <rect x="42" y="46" width="4" height="4" rx="0.8" fill="#00A8E8" />
  <circle cx="43" cy="52" r="1.8" fill="#1B3A8C" />
  <circle cx="49" cy="52" r="1.8" fill="#1B3A8C" />
  <path d="M 43 51 L 46 51 L 48 48" stroke="#1B3A8C" stroke-width="1.2" stroke-linecap="round" fill="none" />
</svg>
