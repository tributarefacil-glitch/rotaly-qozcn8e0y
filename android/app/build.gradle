apply plugin: 'com.android.application'

def getVariable(propName, defaultValue) {
    if (rootProject.ext.has(propName)) {
        return rootProject.ext.get(propName)
    }
    return defaultValue
}

android {
    namespace "br.com.rotaly.app"
    compileSdk getVariable("compileSdkVersion", 34)

    defaultConfig {
        applicationId "br.com.rotaly.app"
        minSdk getVariable("minSdkVersion", 24)
        targetSdk getVariable("targetSdkVersion", 34)
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def rawKeystoreFile = System.getenv("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_PATH")
    def rawStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: System.getenv("STORE_PASSWORD")
    def rawKeyAlias = System.getenv("KEY_ALIAS") ?: System.getenv("ALIAS")
    def rawKeyPassword = System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_KEY_PASSWORD")

    def keystoreFilePath = (rawKeystoreFile != null) ? rawKeystoreFile.trim() : ""
    def storePassword = (rawStorePassword != null) ? rawStorePassword.trim() : ""
    def signingKeyAlias = (rawKeyAlias != null) ? rawKeyAlias.trim() : ""
    // Fallback robusto: se a senha da chave (keyPassword) não estiver definida, usa a própria storePassword
    def signingKeyPassword = (rawKeyPassword != null && !rawKeyPassword.trim().isEmpty()) ? rawKeyPassword.trim() : storePassword

    def hasKeystoreFile = !keystoreFilePath.isEmpty() && file(keystoreFilePath).exists()
    def hasKeystoreCredentials = !storePassword.isEmpty() &&
                                 !signingKeyAlias.isEmpty() &&
                                 !signingKeyPassword.isEmpty()
    def canSignRelease = hasKeystoreFile && hasKeystoreCredentials

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile = file(keystoreFilePath)
                storePassword = storePassword
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
            } else {
                // Previne erro de SigningConfig "release" incompleto se referenciado acidentalmente
                storeFile = signingConfigs.debug.storeFile
                storePassword = signingConfigs.debug.storePassword
                keyAlias = signingConfigs.debug.keyAlias
                keyPassword = signingConfigs.debug.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            } else {
                // Fallback seguro: usa a assinatura de debug padrão quando não houver keystore ou secrets ausentes
                signingConfig signingConfigs.debug
            }
        }
        debug {
            // Mantemos applicationId sem suffix ".debug" para compatibilidade total de pacote
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    def appcompatVer = getVariable("androidxAppCompatVersion", "1.6.1")
    def coreVer = getVariable("androidxCoreVersion", "1.12.0")
    def coordinatorVer = getVariable("androidxCoordinatorLayoutVersion", "1.2.0")
    def playServicesLocVer = getVariable("playServicesLocationVersion", "21.0.1")

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$appcompatVer"
    implementation "androidx.core:core-ktx:$coreVer"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$coordinatorVer"
    implementation 'com.google.android.material:material:1.11.0'
    implementation "com.google.android.gms:play-services-location:$playServicesLocVer"
}
