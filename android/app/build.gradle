apply plugin: 'com.android.application'

android {
    namespace "br.com.rotaly.app"
    compileSdk 34

    defaultConfig {
        applicationId "br.com.rotaly.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def keystoreFilePath = System.getenv("KEYSTORE_FILE")
    def hasReleaseKeystore = keystoreFilePath != null && !keystoreFilePath.trim().isEmpty() && file(keystoreFilePath).exists()

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Fallback seguro: usa a assinatura de debug padrão quando não houver keystore de produção
                signingConfig signingConfigs.debug
            }
        }
        debug {
            // NOTA: mantemos applicationId sem suffix ".debug" para que APKs de debug/release
            // compartilhem o mesmo ID br.com.rotaly.app e permitam teste direto.
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
}
